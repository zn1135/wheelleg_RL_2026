seed: 42
num_steps_per_env: 24
max_iterations: 1000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 50
experiment_name: chuanliantui_stand_v2
run_name: ''
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.5
    std_type: scalar
    std_range: !!python/tuple
    - 0.05
    - 1000000.0
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: ct_mjlab.envs.chuanliantui_stand_v2.network:HistoryActor
critic:
  hidden_dims: !!python/tuple
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 4.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: ct_mjlab.envs.chuanliantui_stand_v2.network:HistoryPPO
