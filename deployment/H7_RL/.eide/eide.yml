      - .cmsis/include
      - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
      - Drivers/CMSIS/DSP/Include
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ''
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            defines: []
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: gnu11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            misc-control: --specs=nano.specs --specs=nosys.specs
            output-debug-info: enable
          linker:
            $outputTaskExcludes: []
            $toolName: gcc
            LD_FLAGS: -nostartfiles
            LIB_FLAGS: -lm
            output-format: elf
        scatterFilePath: Core/Startup/STM32H723VGTx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ''
        bin: ''
        cpuInfo:
          cpuName: 'null'
          vendor: 'null'
        otherCmds: ''
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: '0x08000000'
        bin: ''
        interface: cmsis-dap
        target: stm32h7x
    uploader: OpenOCD
