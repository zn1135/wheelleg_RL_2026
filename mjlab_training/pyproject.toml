[project]
name = "wheelleg-mjlab"
version = "0.1.0"
description = "Chuanliantui closed-chain training with the SCUT V14 PPO recipe"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.6.0", "torch==2.14.0", "warp-lang==1.17.0",
  "onnx>=1.16", "onnxruntime==1.26.0",
]

[project.scripts]
ct-mjlab = "ct_mjlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_mjlab"]
